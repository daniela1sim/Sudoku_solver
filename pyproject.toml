[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-sudoku-solver"
version = "0.1.0"
description = "Explainable human-style Sudoku solver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["Flask>=3.1,<4", "gunicorn>=23,<24; sys_platform != 'win32'"]
vision = ["opencv-python-headless>=4.8,<5", "numpy>=1.24", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sudoku.app" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
